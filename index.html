<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>¡Feliz Cumpleaños, Anita! 🎉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Meow+Script&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #fffbe6;
      }

      .flower {
        position: absolute;
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeInOut 4s ease-in-out infinite;
        opacity: 0;
      }

      .petal {
        position: absolute;
        width: 20px;
        height: 40px;
        background: #ffeb3b;
        border-radius: 50% 50% 0 0;
        transform-origin: bottom center;
      }

      .center {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #fbc02d;
        border-radius: 50%;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <h1
      style="
        text-align: center;
        color: #f57c00;
        font-family: 'Meow Script', cursive;
        font-size: 100px;
        margin: calc(50vh - 100px) 0;
        z-index: 10;
        position: relative;
      "
    >
      ¡Feliz Cumpleaños, Anita! 🎉
    </h1>
    <img
      style="
        width: 200px;
        height: 200px;
        position: absolute;
        top: 60vh;
        left: calc(50vw - 100px);
        /* filter: pixelate(100px); */
      "
      src="../img.jpeg"
    />
    <div id="flower-container"></div>
    <script>
      const container = document.getElementById("flower-container");

      function createFlower() {
        const flower = document.createElement("div");
        flower.className = "flower";

        flower.style.top = `${Math.random() * window.innerHeight}px`;
        flower.style.left = `${Math.random() * window.innerWidth}px`;

        flower.style.animationDelay = `${Math.random() * 5}s`;

        for (let i = 0; i < 12; i++) {
          const petal = document.createElement("div");
          petal.className = "petal";
          petal.style.transform = `rotate(${i * 30}deg) translateY(-20px)`;
          flower.appendChild(petal);
        }

        const center = document.createElement("div");
        center.className = "center";
        flower.appendChild(center);

        container.appendChild(flower);
      }

      for (let i = 0; i < 30; i++) {
        createFlower();
      }
    </script>
  </body>
</html>
